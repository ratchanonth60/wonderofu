[package]
name = "wonder-of-u-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Opt-in async path (Phase 1+ of the codex-rs port). Default is OFF so the
# legacy blocking build keeps passing until Phase 6 stabilizes the port.
# See CLAUDE.md pitfall #1 + docs/codex-port.md.
wonder-of-u-async = ["dep:wonder-of-u-protocol", "dep:tokio"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
glob.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

# Async-path-only dependencies (gated behind `wonder-of-u-async`).
tokio = { workspace = true, optional = true }
wonder-of-u-protocol = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
wonder-of-u-test-support.workspace = true
