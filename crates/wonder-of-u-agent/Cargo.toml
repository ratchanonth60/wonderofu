[package]
name = "wonder-of-u-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Opt-in async path (Phase 1.5+ of the codex-rs port). The legacy blocking
# runtime (ureq) stays the default. See CLAUDE.md pitfall #1.
wonder-of-u-async = [
    "dep:wonder-of-u-protocol",
    "dep:tokio",
    "dep:reqwest",
    "dep:async-trait",
    "dep:bytes",
    "dep:futures",
    "wonder-of-u-core/wonder-of-u-async",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
time.workspace = true
ureq.workspace = true
keyring.workspace = true
wonder-of-u-core.workspace = true
wonder-of-u-storage.workspace = true
wonder-of-u-tools.workspace = true

# Async-path-only dependencies (gated behind `wonder-of-u-async`).
async-trait = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wonder-of-u-protocol = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
wonder-of-u-test-support.workspace = true
