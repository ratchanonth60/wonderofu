[workspace]
members = [
  "crates/wonder-of-u-agent",
  "crates/wonder-of-u-cli",
  "crates/wonder-of-u-core",
  "crates/wonder-of-u-mcp",
  "crates/wonder-of-u-plugins",
  "crates/wonder-of-u-skills",
  "crates/wonder-of-u-storage",
  "crates/wonder-of-u-test-support",
  "crates/wonder-of-u-tools",
  "crates/wonder-of-u-tui",
]
resolver = "3"
default-members = ["crates/wonder-of-u-cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A Rust port of the Claude interactive CLI with full ratatui TUI"
authors = ["wonder-of-u contributors"]
license = "MIT"
repository = "https://github.com/ratchanonth60/wonderofu"
keywords = ["claude", "ai", "tui", "cli", "ratatui"]
categories = ["command-line-utilities"]
readme = "README.md"
[workspace.dependencies]
futures = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
percent-encoding = "2"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
thiserror = "2"
time = { version = "0.3", features = [
  "serde",
  "serde-well-known",
  "formatting",
  "parsing",
] }
uuid = { version = "1", features = ["v4", "serde"] }
glob = "0.3"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
wait-timeout = "0.2"
walkdir = "2"
shell-words = "1"
libc = "0.2"
ureq = "3"

wonder-of-u-core = { path = "crates/wonder-of-u-core" }
wonder-of-u-agent = { path = "crates/wonder-of-u-agent" }
wonder-of-u-mcp = { path = "crates/wonder-of-u-mcp" }
wonder-of-u-plugins = { path = "crates/wonder-of-u-plugins" }
wonder-of-u-skills = { path = "crates/wonder-of-u-skills" }
wonder-of-u-storage = { path = "crates/wonder-of-u-storage" }
wonder-of-u-test-support = { path = "crates/wonder-of-u-test-support" }
wonder-of-u-tools = { path = "crates/wonder-of-u-tools" }
wonder-of-u-tui = { path = "crates/wonder-of-u-tui" }
